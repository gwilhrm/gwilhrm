name: Generate profile assets

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1e6fff&color_dots=#e6eefc,#b9cdf0,#7aa7ff,#1e6fff,#4fd1c5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#4fd1c5&color_dots=#0c1d3a,#17386b,#1e6fff,#7aa7ff,#4fd1c5

      - name: Generate stats card
        run: python build_stats.py dist/stats.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
