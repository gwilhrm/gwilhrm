<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Guilherme Pinheiro — Software Engineering Student | Data, Linux &amp; Python">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset="0.55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#06122a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.5" r="0.35">
      <stop offset="0" stop-color="#1e6fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1e6fff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2a4a7a" opacity="0.35"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- Terminal window (left) -->
    <g transform="translate(40,52)">
      <rect width="300" height="196" rx="10" fill="#071226" stroke="#1d3a66" stroke-width="1.5"/>
      <rect width="300" height="28" rx="10" fill="#0c1d3a"/>
      <rect y="18" width="300" height="10" fill="#0c1d3a"/>
      <circle cx="16" cy="14" r="5" fill="#ff5f57"/>
      <circle cx="32" cy="14" r="5" fill="#febc2e"/>
      <circle cx="48" cy="14" r="5" fill="#28c840"/>
      <text x="150" y="18" text-anchor="middle" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="11" fill="#6f8bb5">guilherme@ubuntu: ~/data</text>
      <g font-family="Consolas, Menlo, 'Courier New', monospace" font-size="13">
        <text x="16" y="54" fill="#4fd1c5">$ <tspan fill="#d6e2f5">git status</tspan></text>
        <text x="16" y="76" fill="#5f7aa3">On branch main, up to date</text>
        <text x="16" y="102" fill="#4fd1c5">$ <tspan fill="#d6e2f5">python etl.py</tspan></text>
        <text x="16" y="124" fill="#5f7aa3">extract → transform → load ✔</text>
        <text x="16" y="150" fill="#4fd1c5">sql&gt; <tspan fill="#7aa7ff">SELECT</tspan><tspan fill="#d6e2f5"> * </tspan><tspan fill="#7aa7ff">FROM</tspan><tspan fill="#d6e2f5"> skills;</tspan></text>
        <text x="16" y="176" fill="#4fd1c5">$ <tspan fill="#d6e2f5">make progress</tspan><tspan fill="#4fd1c5">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
      </g>
    </g>

    <!-- Name & title (center) -->
    <rect x="388" y="92" width="4" height="78" rx="2" fill="#1e6fff"/>
    <text x="410" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" fill="#ffffff" letter-spacing="1"><tspan font-weight="800">GUILHERME</tspan><tspan font-weight="300"> PINHEIRO</tspan></text>
    <text x="412" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#b9cdf0">Software Engineering Student  |  Data, Linux &amp; Python</text>

    <!-- Skill tags -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e6efff">
      <g transform="translate(412,186)">
        <rect width="70" height="28" rx="14" fill="#0f2547" stroke="#2b5aa8"/>
        <text x="35" y="19" text-anchor="middle">CLI</text>
      </g>
      <g transform="translate(492,186)">
        <rect width="70" height="28" rx="14" fill="#0f2547" stroke="#2b5aa8"/>
        <text x="35" y="19" text-anchor="middle">SQL</text>
      </g>
      <g transform="translate(572,186)">
        <rect width="100" height="28" rx="14" fill="#0f2547" stroke="#2b5aa8"/>
        <text x="50" y="19" text-anchor="middle">Git/GitHub</text>
      </g>
      <g transform="translate(682,186)">
        <rect width="130" height="28" rx="14" fill="#0f2547" stroke="#2b5aa8"/>
        <text x="65" y="19" text-anchor="middle">Data Pipelines</text>
      </g>
    </g>

    <text x="412" y="248" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="14" fill="#4fd1c5">&gt; mission: <tspan fill="#d6e2f5">data engineering internship</tspan></text>

    <!-- Data network (right) -->
    <g stroke="#3d7bff" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="960" y1="80" x2="1040" y2="120"/>
      <line x1="1040" y1="120" x2="1120" y2="90"/>
      <line x1="1040" y1="120" x2="1010" y2="190"/>
      <line x1="1010" y1="190" x2="1100" y2="210"/>
      <line x1="1120" y1="90" x2="1100" y2="210"/>
      <line x1="960" y1="80" x2="930" y2="160"/>
      <line x1="930" y1="160" x2="1010" y2="190"/>
      <line x1="1100" y1="210" x2="1160" y2="160"/>
      <line x1="1120" y1="90" x2="1160" y2="160"/>
      <line x1="930" y1="160" x2="960" y2="250"/>
      <line x1="960" y1="250" x2="1010" y2="190"/>
    </g>
    <g fill="#7fb0ff">
      <circle cx="960" cy="80" r="4"/>
      <circle cx="1120" cy="90" r="4"/>
      <circle cx="930" cy="160" r="4"/>
      <circle cx="1010" cy="190" r="5"/>
      <circle cx="1100" cy="210" r="4"/>
      <circle cx="1160" cy="160" r="3.5"/>
      <circle cx="960" cy="250" r="3.5"/>
      <circle cx="1040" cy="120" r="7" fill="#4fd1c5">
        <animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <!-- data packet travelling -->
    <circle r="3" fill="#ffffff">
      <animateMotion dur="4s" repeatCount="indefinite" path="M930,160 L1010,190 L1100,210 L1160,160"/>
    </circle>
  </g>
</svg>
